name: CI / CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-submission:
    name: Validate Submission
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    # Students open PRs from forks and get the submission-format check.
    # PRs from branches of this repo (maintainers, Dependabot) change scripts/
    # or .github/ and would always fail it, so they run the gallery tests instead.
    # If the fork was deleted, head.repo.full_name is empty and the PR is treated as a fork.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run validation
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: node scripts/validate-submission.js

      - name: Run maintenance checks
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/test-build-gallery.js

  build-and-deploy:
    name: Build Gallery & Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build gallery
        run: node scripts/build-gallery.js

      - name: Prepare publish dir
        run: |
          mkdir -p _site
          cp index.html git-guide.html gallery.json _site/
          cp -r submissions _site/submissions
          cp -r assets _site/assets

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
